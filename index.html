<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moodly | حال امروز من</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Moodly ✨</h1>
    <h2>امروز چه حسی داری؟</h2>
    <p>حال امروزت رو انتخاب کن 💜</p>

    <div class="moods">
      <button onclick="showMood('خوشحالی 😊')">😊 خوشحالم</button>
      <button onclick="showMood('معمولی 😐')">😐 معمولی‌ام</button>
      <button onclick="showMood('ناراحتی 😢')">😢 ناراحتم</button>
      <button onclick="showMood('خستگی 😴')">😴 خسته‌ام</button>
      <button onclick="showMood('انرژی 🤩')">🤩 پرانرژی‌ام</button>
      <button onclick="showMood('عالی 😎')">😎 عالی‌ام</button>
    </div>

    <h3 id="result">منتظرم حالت رو انتخاب کنی 💜</h3>
  </main>

  <footer class="site-footer">
    تهیه‌کنندگان: امیر محمد راسخی و علی اصغر شیخیانی
  </footer>

  <script src="script.js"></script>
</body>
</html>
